<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบแอดมิน — ShopPOS</title>
<link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 font-semibold text-lg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-brand-600">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.984-4.804 2.545-7.4.088-.407-.22-.788-.635-.788H5.106M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
        </svg>
        ShopPOS Admin
      </div>
    </div>

    <form method="POST" action="/admin/login" class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm">
      {{ERROR_BLOCK}}
      <label class="block text-sm font-medium mb-1" for="email">อีเมล</label>
      <input type="email" id="email" name="email" required autofocus
        class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-brand-500">

      <label class="block text-sm font-medium mb-1" for="password">รหัสผ่าน</label>
      <input type="password" id="password" name="password" required
        class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm mb-6 focus:outline-none focus:ring-2 focus:ring-brand-500">

      <button type="submit"
        class="w-full bg-brand-600 text-white text-sm font-medium rounded-md py-2.5 hover:bg-brand-700">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>

</body>
</html>
